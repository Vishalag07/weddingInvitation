    <script>
      // Ensure window.fetch has both getter & setter so browser extensions/interceptors don't throw TypeError
      try {
        let _fetch = window.fetch ? window.fetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          get() {
            return _fetch;
          },
          set(newFetch) {
            _fetch = newFetch;
          },
          configurable: true,
          enumerable: true,
        });
      } catch (e) {
        // Ignore if already defined
      }
    </script>
